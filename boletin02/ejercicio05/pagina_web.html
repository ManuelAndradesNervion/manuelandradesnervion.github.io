<!DOCTYPE html>
<html>

<head>
    <title>Formulario de prueba de HTML5</title>
    <meta charset="utf-8">
</head>

<body>
    <fieldset>
        <legend>Formulario de inscripción</legend>
        <form action="https://lm.ciclo.iesnervion.es/avanzado.php" method="get" enctype="multipart/form-data">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required autofocus>
            <br>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br>
            <br>
            <label for="url">Escribe la URL de tu página web personal:</label>
            <input type="url" id="url" name="url">
            <br>
            <br>
            <label for="fecha">Introduce la fecha:</label>
            <input type="date" id="fecha" name="fecha">
            <br>
            <br>
            <label for="tiempo">Introduce la hora:</label>
            <input type="time" id="tiempo" name="tiempo">
            <br>
            <br>
            <label for="fechahora">Introduce la fecha y hora:</label>
            <input type="datetime" id="fechahora" name="fechahora">
            <br>
            <br>
            <label for="mes">Introduce el mes:</label>
            <input type="month" id="mes" name="mes">
            <br>
            <br>
            <label for="semana">Introduce la semana:</label>
            <input type="week" id="semana" name="semana">
            <br>
            <br>
            <label for="numero">Introduce un número:</label>
            <input type="number" id="numero" name="numero" range="-10,10">
            <br>
            <br>
            <label for="teléfono">Introduce tu número de teléfono:</label>
            <input type="tel" id="teléfono" name="teléfono">
            <br>
            <br>
            <label for="búsqueda">Introduce un término de búsqueda:</label>
            <input type="search" id="búsqueda" name="búsqueda">
            <br>
            <br>
            <label for="color">Elige un color:</label>
            <input type="color" id="color" name="color" value="#fffff">

        </form>
    </fieldset>
    <br>
    <input type="submit" value="Enviar formulario">
    <br>
    <br>
    <hr>
    <br>
    <a href="../index.html">Índice</a>
</body>

</html>
