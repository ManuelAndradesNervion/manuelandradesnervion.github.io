<!DOCTYPE html>
<html>

<head>
    <title>Ejercicio 03</title>
    <meta charset="utf-8">
</head>

<body>
    <form action="https://lm.ciclo.iesnervion.es/registro.php" method="post">
        <fieldset>
            <legend>Campos y restricciones de validación</legend>
            <label for="codigo">Código de Alumno:</label>
            <input type="text" id="codigo" name="codigo" pattern="[A-Z]{3}[0-9]{3}" required>
            <br>
            <br>
            <label for="email">Correo corporativo:</label>
            <input type="email" id="email" name="email" required>
            <br>
            <br>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="16" max="65">
            <br>
            <br>
            <label for="telefono">Teléfono de contacto:</label>
            <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}">
            <br>
            <br>
            <label for="web">Sitio web / Portfolio:</label>
            <input type="url" id="web" name="web">
            <br>
            <br>
            <label for="ide">IDE preferido:</label>
            <input type="text" id="ide" name="ide" list="ide">
            <datalist id="ide">
                <option value="IntelliJ IDEA"></option>
                <option value="Visual Studio Code"></option>
                <option value="Eclipse"></option>
                <option value="Android Studio"></option>
            </datalist>
            <br>
            <br>
            <label for="politica">Aceptación de la Política de Privacidad</label>
            <input type="checkbox" id="politica" name="politica" required>
        </fieldset>
        <br>
        <button type="submit" value="finalizarRegistro">Finalizar registro</button>
        <br>
        <br>
    </form>
    <hr>
    <a href="../index.html">Índice</a>
</body>

</html>
