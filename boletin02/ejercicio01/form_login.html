<!DOCTYPE html>
<html>

<head>
    <title>Formulario de login</title>
    <meta charset="utf-8">
</head>
<body>
    
    <form action="https://lm.ciclo.iesnervion.es/login.php" method="post">
        <label for="Nombre de usuario o Email">Nombre de usuario o Email:</label>
        <input type="text" id="usuario" name="usuario" placeholder="usuario@dominio.com" required>
        <br>
        <br>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="Contraseña" required>
        <br>
        <br>
        <label for="Recordar sesión">Recordar sesión:</label>
        <input type="checkbox" id="recordar" name="recordar">
        <br>
        <br>
        <button type="submit" value="Iniciar sesión">Iniciar sesión</button>
    </form>

    <hr>
    <a href="../../index.html">Índice</a>
</html>
